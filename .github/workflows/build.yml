# 手动触发的双端产物构建 + 发布（不影响 ci.yml 的测试流水线）。
#
# - Windows：NSIS 安装包；有 `TAURI_SIGNING_PRIVATE_KEY` 时自动用 minisign 签名（桌面端一键更新必需）
# - Android：arm64 release APK（有 keystore secrets 时用正式签名）
# - release=true：建/更新 GitHub Release、上传资产、按产物重算 latest.json（sha256/size/signature）
#
# 与 ci.yml 相同的两个环境坑：
#   1. 仓库里入库的 .cargo/config.toml 指向国内 USTC 镜像，GitHub runner 上要去掉；
#   2. tauri 的 generate_context! 编译期要求 frontendDist 存在，
#      但 `pnpm tauri build` 会先跑 beforeBuildCommand（vite build）自己产出 dist。
name: Build

on:
  workflow_dispatch:
    inputs:
      windows:
        description: '构建 Windows 安装包'
        type: boolean
        default: true
      android:
        description: '构建 Android APK'
        type: boolean
        default: true
      release:
        description: '发布到 GitHub Release 并更新 latest.json'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.0

jobs:
  windows:
    name: Windows NSIS
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # 私钥只在 runner 内存里落地成临时文件，构建完即随 runner 销毁。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 去掉国内 cargo 镜像配置
        run: rm -f .cargo/config.toml
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 构建安装包
        run: pnpm tauri build
      # 注意：job 级 env 已经把私钥喂给 CLI（`--private-key` 的 env 变量），
      # 此时再传 `-f/--private-key-path` 会被 clap 判为参数冲突（实测报
      # "cannot be used with --private-key"），所以这里只用 env、不传 -f。
      - name: 签名安装包（有私钥才做）
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          pnpm tauri signer sign -p "" "$EXE"
          ls -l src-tauri/target/release/bundle/nsis/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  android:
    name: Android APK
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 去掉国内 cargo 镜像配置
        run: rm -f .cargo/config.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 SDK 组件
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1); fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" 'platforms;android-36' 'ndk;27.0.12077973'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 还原签名 keystore（有 secret 才做）
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.keystore" \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            > src-tauri/gen/android/app/key.properties
      # 仓库里 gradle wrapper 指向腾讯镜像（国内用户友好），但 GitHub runner 上偶发超时：
      # 实测报 `Downloading from https://mirrors.cloud.tencent.com/gradle/... failed: timeout`。
      # CI 里临时改成官方源（只改工作区，不回写仓库）。
      - name: 构建 APK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_HOME"
          sed -i 's#mirrors\.cloud\.tencent\.com/gradle#services.gradle.org/distributions#' \
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          pnpm tauri android build --apk --target aarch64 || \
            (echo '首次构建失败，重试一次（Gradle 发行版下载偶发超时）' && \
             pnpm tauri android build --apk --target aarch64)
      - name: 核对 R8 没删 JNI 入口
        run: grep -E 'installUpdateApk|networkMetered' src-tauri/gen/android/app/build/outputs/mapping/universalRelease/mapping.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    name: 发布
    needs: [windows, android]
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 建 / 更新 Release，上传资产并写 latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          TAG="v$VERSION"
          EXE=$(find dist -name '*.exe' -print -quit)
          SIG=$(find dist -name '*.exe.sig' -print -quit)
          APK=$(find dist -name '*.apk' -print -quit)
          for f in "$EXE" "$SIG" "$APK"; do [ -n "$f" ] || { echo "缺少产物"; exit 1; }; done
          cp "$EXE" "Marcel-SSH-Self_${VERSION}_x64-setup.exe"
          cp "$SIG" "Marcel-SSH-Self_${VERSION}_x64-setup.exe.sig"
          cp "$APK" "Marcel-SSH-Self_${VERSION}_arm64.apk"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "自建版本线 $TAG"
          gh release upload "$TAG" \
            "Marcel-SSH-Self_${VERSION}_x64-setup.exe" \
            "Marcel-SSH-Self_${VERSION}_arm64.apk" --clobber
          python3 scripts/publish_latest.py "$VERSION" \
            "Marcel-SSH-Self_${VERSION}_x64-setup.exe" \
            "Marcel-SSH-Self_${VERSION}_x64-setup.exe.sig" \
            "Marcel-SSH-Self_${VERSION}_arm64.apk"
